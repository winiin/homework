<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>сайт + Todo</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.6;
      padding: 20px;
      max-width: 700px;
      margin: auto;
      background-color: #2a0310;
      color: #280202;
    }

    .profile-card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      border: 2px solid #250208;
      box-shadow: 0 10px 20px rgba(170, 68, 68, 0.05);
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      color: #410519;
      font-family: 'Georgia', serif;
    }

    .avatar {
      width: 150px;
      border-radius: 50%;
      border: 4px dotted #2b040a;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Стили для Todo */
    .todo-section {
      background: #fffafa;
      padding: 20px;
      border-radius: 15px;
      border: 1px dashed #2d0409;
      margin-top: 20px;
    }

    .stats-bar {
      font-size: 14px;
      color: #27040f;
      margin-bottom: 15px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      border-radius: 15px;
      border: 1px solid #5d1521;
      width: 60%;
      outline: none;
    }

    button {
      background-color: #540d18;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 15px;
      cursor: pointer;
      margin-left: 5px;
      transition: 0.3s;
    }

    button:hover { background-color: rgb(65, 11, 11); }

    ul { list-style: none; padding: 0; }

    li {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid #3d0f16;
    }

    .completed { text-decoration: line-through; opacity: 0.6; }

    a { color: #410d0d; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Компонент Header (Обо мне)
    const ProfileHeader = () => (
      <div className="profile-card">
        <h1>Обо мне </h1>
        <img src="ghb.jpg" className="avatar" alt="fox" />
        <p>спасите пж.</p>
        <p>мой первый проект </p>
        <div style={{marginTop: '10px'}}>
            <a href="https://github.com/winiin/homework" target="_blank">GitHub</a> | <a href="https://www.instagram.com/winnin_nii" target="_blank">Instagram</a>
        </div>
      </div>
    );

    // Главное приложение
    function App() {
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('help todos');
        return saved ? JSON.parse(saved) : [];
      });
      const [inputValue, setInputValue] = useState('');

      useEffect(() => {
        localStorage.setItem('help_todos', JSON.stringify(todos));
      }, [todos]);

      const total = todos.length;
      const completedCount = todos.filter(t => t.completed).length;

      const addTodo = () => {
        if (!inputValue.trim()) return;
        setTodos([...todos, { id: Date.now(), text: inputValue, completed: false }]);
        setInputValue('');
      };

      const toggleTodo = (id) => {
        setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTodo = (id) => {
        setTodos(todos.filter(t => t.id !== id));
      };

      return (
        <div>
          <ProfileHeader />

          <div className="todo-section">
            <h3>Мой First Todo Список </h3>

            <div className="stats-bar">
              Задач: {total} | Сделано: {completedCount}
            </div>

            <div style={{ display: 'flex', marginBottom: '20px' }}>
              <input
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                placeholder="Что нужно сделать?"
              />
              <button onClick={addTodo}>Добавить</button>
            </div>

            <ul>
              {todos.map(todo => (
                <li key={todo.id}>
                  <span
                    onClick={() => toggleTodo(todo.id)}
                    className={todo.completed ? 'completed' : ''}
                    style={{ cursor: 'pointer', flexGrow: 1 }}
                  >
                    {todo.completed ? '✅ ' : 'ㅤ♡ྀི '} {todo.text}
                  </span>
                  <button onClick={() => deleteTodo(todo.id)} style={{background:"4F160A", color: '#B32912'}}>✕</button>
                </li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
